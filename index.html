<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisan Mitra Login</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">

    <h1>🌾 Kisan Mitra</h1>

    <h2>Admin Login</h2>

    <input
    type="text"
    id="username"
    placeholder="Username">

    <input
    type="password"
    id="password"
    placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

</div>

<script>

function login(){

    const username =
    document.getElementById(
    "username"
    ).value;

    const password =
    document.getElementById(
    "password"
    ).value;

    if(
        username === "admin" &&
        password === "admin123"
    ){

        localStorage.setItem(
        "loggedIn",
        "true"
        );

        window.location.href =
        "dashboard.html";
    }

    else{

        document.getElementById(
        "message"
        ).innerText =
        "Invalid Username or Password";
    }
}

</script>

</body>
</html>
